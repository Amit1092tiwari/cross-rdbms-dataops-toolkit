version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dataops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./postgresql:/docker-entrypoint-initdb.d/scripts:ro

  mysql:
    image: mysql:8.0
    container_name: dataops-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: testdb
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./mysql:/docker-entrypoint-initdb.d/scripts:ro
